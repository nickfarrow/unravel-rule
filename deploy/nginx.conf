# nginx in front of unravel-server. Include it inside nginx's http block, for example from
# /etc/nginx/conf.d/. The certificate paths are certbot's.
#
# The server has 8 workers and no timeouts of its own, so it must only ever see whole
# requests from nginx. A client trickling bytes then ties up nginx, which is built for it,
# rather than a worker.

# Per-IP limits. Generous, because several people behind one Tor exit share an address:
# an open page asks about once every two seconds, more while it signs.
limit_req_zone $binary_remote_addr zone=unravel_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=unravel_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name unravelrule.xyz;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unravelrule.xyz;
    ssl_certificate /etc/letsencrypt/live/unravelrule.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unravelrule.xyz/privkey.pem;
    # Browsers that have seen this never try plain HTTP again.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The server sees which hop address goes to which destination. Logging IP addresses too
    # would tie both to a person.
    access_log off;
    # Refusals by the limits below would otherwise go to the error log with the address.
    limit_req_log_level info;
    limit_conn_log_level info;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    # The server reads at most 16 KiB of a request.
    client_max_body_size 16k;
    limit_conn unravel_conn 20;

    # The page shows a server's "error" field, so a limit's reply is JSON too.
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @limited;
    location @limited {
        default_type application/json;
        return 429 '{"error":"too many requests from your address. try again in a moment."}';
    }

    location / {
        proxy_pass http://127.0.0.1:8322;
        # nginx's default, stated because the server depends on it: the request reaches the
        # server only once all of it has arrived.
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        # Each Electrum call gives up after 20s, and a status check makes up to three.
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=unravel_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8322;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
