[package]
name = "unravel-server"
version = "0.1.0"
edition = "2024"

[dependencies]
unravel = { path = ".." }
bitcoin = "0.32"
schnorr_fun = "0.13"
rand = "0.8"
serde_json = "1"
tiny_http = "0.12"
electrum-client = { version = "0.24", default-features = false, features = ["proxy", "use-rustls-ring"] }
bdk_bitcoind_rpc = "0.22"
bitcoind = { version = "0.36", features = ["26_0"] }
miniscript = "12"
qrcode = { version = "0.14", default-features = false }
